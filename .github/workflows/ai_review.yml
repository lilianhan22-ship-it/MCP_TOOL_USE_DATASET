name: MCP Tool Use Data Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout trusted review code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade PyGithub openai pymupdf

      - name: Run MCP task review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_REVIEW_MODELS: ${{ vars.LLM_REVIEW_MODELS || 'gpt-5.5,claude-opus-4-7' }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || inputs.pr_number }}
        run: python scripts/review_pr.py
